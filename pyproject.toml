[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-ragify"
version = "2.0.0"
description = "Contained, TUI-driven Wikipedia -> knowledge-base pipeline (crawl, gate, split, archive, embed, retrieve)."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "ollama",
    "pydantic>=2",
    "textual",
    "nltk",
    "datasketch",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
vector = ["sqlite-vec"]
tokens = ["tiktoken"]
dev = ["pytest"]

[project.scripts]
wiki-ragify = "wiki_ragify.__main__:main"

[tool.uv]
# Project-managed by uv (see https://docs.astral.sh/uv/).
# Build artifacts: `uv build` -> ./dist/ (sdist + wheel).
package = true

# Bundle runtime data files that aren't .py (styles + template). Without this,
# `packages.find` ships only .py files and the CLI crashes (styles.tcss missing).
[tool.setuptools.package-data]
wiki_ragify = ["gating/*.txt", "ui/*.tcss"]

[tool.setuptools.packages.find]
include = ["wiki_ragify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
